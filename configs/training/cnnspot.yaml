model:
  class: deepfake_detection.models.detection.CNNSpot
  params:
    name: CNNSpot
    load_model: true

training:
  label: authenticity
  pos_label: fake

  num_train_epochs: 10000
  per_device_train_batch_size: 64
  dataloader_num_workers: 4

  output_dir: checkpoints/cnnspot/

  fp16: true

  gradient_accumulation_steps: 1
  lr_scheduler_type: constant
  warmup_steps: 0

  augmentations:
    - class: torchvision.transforms.v2.Resize
      params:
        size: 256
    - class: deepfake_detection.models.training.augmentations.blur.RandomGaussianBlur
      params:
        sigma: [0.0, 3.0]
        prob: 0.1
    - class: deepfake_detection.models.training.augmentations.compression.RandomPILJpegCompression
      params:
        quality_range: [30, 100]
        prob: 0.1
        methods: [cv2, pil]
    - class: torchvision.transforms.v2.RandomCrop
      params:
        size: [224, 224]
    - class: torchvision.transforms.v2.RandomHorizontalFlip
      params:
        p: 0.5

  optimizer:
    class: torch.optim.Adam
    params:
      lr: 0.0001
      betas: [0.9, 0.999]

  mlflow:
    tracking_uri: mlflow.db
    experiment_name: deepfake_training
    run_name: cnnspot_run1
