model:
  class: deepfake_detection.models.detection.rPPGLSTM
  params:
    name: rPPGLSTM
    load_model: false
    num_frames: 120
    num_features: 77
    num_layers: 5
    hidden_size: 128
    num_classes: 2
    # Set to a directory path to cache extracted rPPG features on disk.
    # On the first training run, features are extracted from each video and
    # saved as .npy files; every subsequent epoch (and run) loads the cache
    # instead, saving significant compute.
    feature_cache_dir: /mnt/extern/DeepFake/Experiments/rPPG

training:
  label: authenticity
  pos_label: fake

  seed: 42

  output_dir: outputs/rppg_lstm

  num_train_epochs: 100
  # Required when the dataset has no __len__ (e.g. iterable video datasets).
  # Set to dataset_size / batch_size * num_epochs. Overrides num_train_epochs.
  # max_steps: 10000
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32

  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_drop_last: false

  fp16: false
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

  lr_scheduler_type: linear
  warmup_steps: 0

  optimizer:
    class: torch.optim.Adam
    params:
      lr: 0.001

  callbacks:
    - class: transformers.EarlyStoppingCallback
      params:
        early_stopping_patience: 5

  mlflow:
    tracking_uri: mlflow.db
    experiment_name: rppg_lstm
    run_name: run1
