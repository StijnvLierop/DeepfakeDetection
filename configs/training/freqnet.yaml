model:
  class: deepfake_detection.models.detection.FreqNet
  params:
    name: FreqNet
    load_model: true
    # ckpt: /path/to/pretrained.pth  # omit to train from scratch

training:
  label: authenticity
  pos_label: fake

  num_train_epochs: 100
  per_device_train_batch_size: 32
  dataloader_num_workers: 4

  output_dir: checkpoints/freqnet/

  # fp16 is disabled: cuFFT requires power-of-two spatial sizes in half precision, but FreqNet uses 224x224
  fp16: false

  gradient_accumulation_steps: 1
  lr_scheduler_type: cosine
  warmup_steps: 0

  augmentations:
    - class: torchvision.transforms.v2.RandomHorizontalFlip
      params:
        p: 0.5
    - class: deepfake_detection.models.training.augmentations.blur.RandomGaussianBlur
      params:
        sigma: [0.0, 3.0]
        prob: 0.1
    - class: deepfake_detection.models.training.augmentations.compression.RandomPILJpegCompression
      params:
        quality_range: [30, 100]
        prob: 0.5

  optimizer:
    class: torch.optim.Adam
    params:
      lr: 0.0002
      betas: [0.9, 0.999]

  mlflow:
    tracking_uri: mlflow.db
    experiment_name: deepfake_training
    run_name: freqnet_run1
