name: CI
on:
  # Triggers for any branch
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  # Build
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Flake8 Annotator
        uses: rbialon/flake8-annotations@v1

      - name: Run unit tests
        run: python -m pytest --import-mode=append tests/

  # Bump version
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for full commit history

      - name: Install Python Semantic Release
        run: pip install python-semantic-release

      # Minor/major versions are bumped manually for now
      - name: Patch Version Bump Release
        env:
          github_token: ${{ secrets.VERSION_BUMP_TOKEN }}
        run: semantic-release publish --patch