# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for all branches
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Flake8 Annotator
        # You may pin to the exact commit or the version.
        # uses: rbialon/flake8-annotations@48819b39d57c621b5a64a1cdce40a5caa6a43b89
        uses: rbialon/flake8-annotations@v1

      - name: Python Unit Test
        # You may pin to the exact commit or the version.
        # uses: onichandame/python-test-action@6a1d618300de7ea0b753e50819e093a7e5a5f60b
        uses: onichandame/python-test-action@0.0.0
        with:
          # dependency list
          deps_list: requirements.txt
          # path of git repo relative to GITHUB_WORKSPACE(no trailing slash)
          path: .
          # directory of test scripts
          test_dir: .
          # pattern of the test script name
          pattern: test_*.py
          
          
