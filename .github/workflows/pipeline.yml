name: CICD
on:
  # Triggers for any branch
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  # Build
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Check
        # This checks for PEP 8 violations and coding errors
        run: ruff check --output-format=full --statistics .

      - name: Run Ruff Format
        # This ensures the code is formatted (like Black)
        run: ruff format --check --diff .

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.18'
          cache: 'pip'

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4

      - name: Install dependencies
        run: |
          pdm install
          pdm install -dG test

      - name: Run unit tests
        run: pdm run pytest --import-mode=append tests/

  # Bump version
  release:
    # Only run on main branch
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1_0fake  # Needed for full commit history

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.VERSION_BUMP_TOKEN }}