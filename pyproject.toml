[project]
name = "deepfake_detection"
version = "0.35.1"
description = "Default template for PDM package"
readme = "README.md"
requires-python = "==3.10.*"
authors = [
    {name = "Stijn van Lierop", email = "s.van.lierop@nfi.nl"},
    {name = "Stijn van Lierop", email = "150940112+StijnvLierop@users.noreply.github.com"},
]
dependencies = [
    "pillow>=11.3.0",
    "matplotlib==3.10.0",
    "scikit-learn==1.6.0",
    "confidence==0.15",
    "seaborn==0.13.2",
    "scikit-image==0.25.1",
    "PyWavelets==1.8.0",
    "opencv-python==4.11.0.86",
    "numpy>=2.2.6",
    "imagehash>=4.3.2",
    "tqdm>=4.67.1",
    "torch>=2.7.1",
    "fiftyone==1.11.1",
    "torchvision>=0.22.1",
    "datasets>=4.4.2",
    "typing-extensions>=4.10",
    "transformers>=4.57.3",
    "accelerate>=0.26.0",
    "clip @ git+https://github.com/openai/CLIP.git",
    "albumentations>=2.0.8",
    "diffusers>=0.36.0",
    "umap-learn>=0.5.11",
    "tbb>=2021.6.0",
    "timm>=1.0.24",
    "open-clip-torch>=3.2.0",
    "mlflow>=3.9.0",
]
license = {text = "MIT"}

[dependency-groups]
test = [
    "pytest>=8.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepfake_detection*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies = {dev = { file = ["requirements-dev.txt"] }}

[tool.semantic_release]
assets = []
build_command_env = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = false
allow_zero_version = true
repo_dir = "."
no_git_verify = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.pdm]
distribution = true

[changelog.default_templates]
changelog_file = ""
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[build-system]
requires = ["setuptools>=61", "pdm-backend"]
build-backend = "setuptools.build_meta"